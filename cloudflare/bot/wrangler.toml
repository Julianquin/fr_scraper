# Configuración del Worker de los botones del canal (worker.js) por si se publica con la CLI
# (`npx wrangler deploy`) en vez de pegarlo en el panel. Los secretos NO van aquí:
#   npx wrangler secret put GITHUB_TOKEN   (y TELEGRAM_BOT_TOKEN, TELEGRAM_ADMIN_CHAT_ID, WEBHOOK_SECRET)
name = "bot-canal"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true             # Telegram necesita una URL a la que llamar (protegida con WEBHOOK_SECRET)

[triggers]
crons = ["0 12 * * *"]         # todos los días 12:00 UTC = 07:00 Colombia: publica lo aprobado

[vars]
REPO = "Julianquin/fr_scraper"
RAMA = "main"
