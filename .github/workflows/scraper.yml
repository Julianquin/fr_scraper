# ─────────────────────────────────────────────────────────────────────────────
# Scraper de FincaRaíz por MATRIZ de departamentos.
#
#   Job 1 (scrape): un job por departamento en paralelo (máx. N a la vez).
#                   Cada uno scrapea urls/<depto>.txt y sube sus CSV como artifact.
#   Job 2 (merge):  descarga todos los artifacts, corre ingest, reconstruye el
#                   dataset del dashboard y lo sube a Cloudflare R2.
#   Job 3 (pages):  regenera el mapa con el dataset de R2 y lo publica.
#
# Los datos viven en R2 (src/almacen.py), no en git: cada job los baja al
# empezar y el merge los sube al terminar, con un respaldo diario.
#
# ⚠️ Cuanto más alto `max-parallel`, más rápido termina pero más agresivo es con
#    FincaRaíz (mayor riesgo de bloqueo / ToS). También roza las políticas de uso
#    de GitHub Actions. Mantén el paralelismo moderado.
# ─────────────────────────────────────────────────────────────────────────────
name: Scraper diario FincaRaíz (matriz por departamento)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Páginas máximas por URL"
        default: "50"

permissions:
  contents: read      # los datos ya no se commitean: van a R2
  pages: write        # deploy a GitHub Pages
  id-token: write     # requerido por actions/deploy-pages

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}

concurrency:
  group: scraper-matriz
  cancel-in-progress: false

jobs:
  # ── 1) Un job por departamento (en paralelo, con tope de concurrencia) ──
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # tope de GitHub es 360; cortamos justo antes
    strategy:
      fail-fast: false            # si un depto falla, los demás siguen
      max-parallel: 4             # deptos scrapeando a la vez (súbelo/bájalo aquí)
      matrix:
        depto:
          - amazonas
          - antioquia
          - atlantico
          - bogota-dc
          - bolivar
          - caldas
          - cordoba
          - cundinamarca
          - magdalena
          - meta
          - narino
          - norte-de-santander
          - quindio
          - risaralda
          - san-andres
          - santander
          - tolima
          - valle-del-cauca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verificar Google Chrome
        run: google-chrome --version || echo "Chrome no encontrado"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Bajar el master desde R2 (el incremental corta en lo ya conocido)
        run: python -m src.almacen bajar --solo master/listings.parquet
      - name: Scrapear ${{ matrix.depto }}
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '50' }}
        run: |
          python -m src.scraper --headless --incremental \
            --url-file "urls/${{ matrix.depto }}.txt" \
            --max-pages "$MAX_PAGES" \
            --workers 4 --delay 1 --recycle-every 10
      - name: Subir resultados del depto
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.depto }}
          path: data/raw/**/*.csv
          retention-days: 7
          if-no-files-found: ignore

  # ── 2) Consolidar todo, limpiar y refrescar el dataset del dashboard ──
  merge:
    needs: scrape
    if: always()                  # corre aunque algún depto falle/expire
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Descargar resultados de todos los deptos
        uses: actions/download-artifact@v4
        with:
          path: _artifacts
      - name: Consolidar CSV en data/raw/<fecha>/
        run: |
          DEST="data/raw/$(date -u +%F)"
          mkdir -p "$DEST"
          find _artifacts -name '*.csv' -exec cp -n {} "$DEST/" \; 2>/dev/null || true
          echo "CSVs consolidados: $(ls "$DEST" 2>/dev/null | wc -l)"
      - name: Bajar datos actuales desde R2
        run: python -m src.almacen bajar
      - name: Upsert al master + reconstruir dataset del dashboard
        run: |
          python -m src.ingest_master     # upsert incremental por id_inmueble
          python -m src.build_app_dataset  # dataset del dashboard desde el master
      - name: Subir master + dataset (respaldo, 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ github.run_id }}
          path: |
            data/master/*.parquet
            data/app/*.parquet
          retention-days: 90
          if-no-files-found: warn
      - name: Subir a R2 (scrapeo del día, master, bitácora, dataset y respaldo)
        run: |
          python -m src.almacen raw --fecha "$(date -u +%F)"
          python -m src.almacen subir --fecha "$(date -u +%F)"

  # ── 3) Regenerar el mapa con datos frescos y publicar en GitHub Pages ──
  pages:
    needs: merge                  # solo si el merge terminó OK (dataset fresco listo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Bajar el dataset fresco desde R2
        run: python -m src.almacen bajar --solo app/housing_clean.parquet
      - name: Regenerar mapas en docs/ con datos frescos
        run: python -m src.viz_map --ciudad Cali --out docs/cali.html
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar docs/ como artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy a GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
