# ─────────────────────────────────────────────────────────────────────────────
# Canal público de Telegram con aprobación del administrador (src/canal.py).
#
#   proponer  al terminar el barrido de Metrocuadrado (~02:45 Colombia): manda al chat del administrador las
#             publicaciones del día (oportunidad del día; los lunes el pulso, los jueves las bajadas), cada una
#             como saldrá en el canal, con «Publicar» y «Descartar».
#   aprobar   lo lanza el Worker cloudflare/bot/ al pulsar «Publicar»: a la cola, o al canal ya si son más de
#             las 07:00 de Colombia.
#   publicar  lo lanza el mismo Worker a las 07:00 de Colombia: copia al canal lo aprobado.
#
# El canal (TELEGRAM_CANAL_ID) y la línea de contacto (marca/config.json en R2) no están en el código: el
# repositorio es público. Por la misma razón el programa no imprime textos de marca en el registro.
# ─────────────────────────────────────────────────────────────────────────────
name: Canal público

on:
  workflow_run:
    workflows: ["Barrido diario Metrocuadrado"]
    types: [completed]
  workflow_dispatch:
    inputs:
      accion:
        description: "proponer (lo normal), aprobar o publicar"
        type: choice
        options: [proponer, aprobar, publicar]
        default: proponer
      mensaje:
        description: "id del mensaje propuesto (solo para aprobar)"
        default: ""

permissions:
  contents: read

concurrency:
  group: canal                 # aprobar y publicar leen y escriben canal/estado.json: de uno en uno
  cancel-in-progress: false

jobs:
  canal:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACCION: ${{ github.event.inputs.accion || 'proponer' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      TELEGRAM_CANAL_ID: ${{ secrets.TELEGRAM_CANAL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ "$ACCION" = "proponer" ]; then pip install -r requirements-entrenamiento.txt; else pip install -r requirements.txt; fi
      - name: Bajar de R2 el estado, su historial, arriendos, Metrocuadrado, OSM y el modelo (solo para proponer)
        if: env.ACCION == 'proponer'
        run: |
          python -m src.consolidar --bajar
          python -m src.consolidar --raiz arriendo --bajar
          python -m src.consolidar --raiz m2_venta --bajar
          python -m src.almacen traer estado/historial/ --destino data
          python -m src.almacen traer osm/ --destino data
          mkdir -p data/modelos
          for f in precio_vivienda.joblib estimados_sin_ver.parquet; do
            { python -m src.almacen traer "modelos/$f" --destino data/_r2tmp && mv "data/_r2tmp/modelos/$f" data/modelos/; } \
              || echo "⚠️  Sin modelos/$f"
          done
      - name: Canal (${{ env.ACCION }})
        env:
          MENSAJE: ${{ github.event.inputs.mensaje }}
        run: |
          case "$ACCION" in
            proponer) python -m src.canal proponer ;;
            aprobar)  python -m src.canal aprobar --mensaje "$MENSAJE" ;;
            publicar) python -m src.canal publicar ;;
          esac
      - name: Avisar al administrador si algo falló
        if: failure()
        run: >-
          python -m src.monitor fallo
          "El canal público falló (${{ env.ACCION }})"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
