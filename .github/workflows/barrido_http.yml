# ─────────────────────────────────────────────────────────────────────────────
# Barrido diario de FincaRaíz: venta (E1) y arriendo (E3). Deja su crudo en R2
# (raw/venta_http/fecha=…/, raw/arriendo_http/) y el estado del mercado (estado/, estado_arriendo/).
#
# Desde el 20-nov-2026, por el SITEMAP OFICIAL DE AVISOS del portal (src/sitemap_fincaraiz.py): ese día FincaRaíz
# empezó a pedir un desafío del cortafuegos de AWS en sus páginas de resultados a partir de la 2, y el barrido por
# segmentos (src/scraper_http.py plan/barrer) ya no puede recorrerlas. No se salta: se lee lo que el portal publica
# para los buscadores. El sitemap dice qué avisos siguen publicados y cuándo cambió cada uno; se leen solo los nuevos
# y los cambiados (la página de cada aviso trae el mismo JSON que los listados) y el resto sale del estado de ayer.
#
#   sitemap / sitemap_arriendo:  el sitemap de cada raíz y la lectura de lo nuevo o cambiado (en paralelo: dos
#                                lectores con pausa, menos carga que los 4 grupos del barrido por páginas)
#   juntar / juntar_arriendo:    igual que antes (src/scraper_http.py juntar): une, mide la cobertura frente al total
#                                que declara el portal y sube el crudo + reporte a R2; luego consolida avisos +
#                                historial (src/consolidar.py: solo lo que cambió)
#   monitor:                     resumen del día por Telegram SOLO al administrador (src/monitor.py). Corre siempre;
#                                si un día no llega, algo no corrió.
#
# Lo lanza a las 00:00 de Colombia el disparador de Cloudflare (cloudflare/disparador/). Al terminar se encadenan el
# mapa (mapa.yml) y Metrocuadrado (metrocuadrado.yml); la alerta de los lunes la lanza el mismo disparador a las
# 07:00. También se puede lanzar a mano.
# ─────────────────────────────────────────────────────────────────────────────
name: Barrido diario (venta y arriendo)

on:
  workflow_dispatch:             # 00:00 de Colombia, desde Cloudflare

permissions:
  contents: read

concurrency:
  group: barrido-http
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Venta por el sitemap (lo nuevo y lo cambiado; lo demás, del estado de ayer)
        env:            # para leer el estado de ayer en R2
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m src.sitemap_fincaraiz --pausa 0.3 barrer
      - uses: actions/upload-artifact@v4
        with:
          name: http-sitemap
          path: |
            data/http/barrido_0.parquet
            data/http/informe_0.csv
            data/http/nacional.json
          retention-days: 3

  juntar:
    needs: sitemap
    if: ${{ !cancelled() && needs.sitemap.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: http-*
          path: data/http
          merge-multiple: true
      - name: Juntar, medir cobertura y subir a R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m src.scraper_http juntar --subir
      - name: Consolidar avisos + historial (solo lo que cambió)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          FECHA=$(ls data/raw_http | sort | tail -1)      # la fecha que acaba de escribir "juntar"
          python -m src.consolidar --bajar --fecha "$FECHA" --subir

  # ── Arriendos (E3) ─────────────────────────────────────────────────────────
  sitemap_arriendo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Arriendo por el sitemap (lo nuevo y lo cambiado; lo demás, del estado de ayer)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m src.sitemap_fincaraiz --raiz arriendo --pausa 0.3 barrer
      - uses: actions/upload-artifact@v4
        with:
          name: arriendo-sitemap
          path: |
            data/http_arriendo/barrido_0.parquet
            data/http_arriendo/informe_0.csv
            data/http_arriendo/nacional.json
          retention-days: 3

  juntar_arriendo:
    needs: sitemap_arriendo
    if: ${{ !cancelled() && needs.sitemap_arriendo.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: arriendo-*
          path: data/http_arriendo
          merge-multiple: true
      - name: Juntar, medir cobertura y subir a R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m src.scraper_http --raiz arriendo juntar --subir
      - name: Consolidar arriendos (solo lo que cambió)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          FECHA=$(ls data/raw_http_arriendo | sort | tail -1)
          python -m src.consolidar --raiz arriendo --bajar --fecha "$FECHA" --subir

  # ── Monitor de salud ───────────────────────────────────────────────────────
  monitor:
    needs: [sitemap, juntar, sitemap_arriendo, juntar_arriendo]
    if: ${{ !cancelled() }}      # justo cuando algo falla es cuando más importa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resumen del día al administrador
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          python -m src.monitor resumen \
            --jobs "sitemap=${{ needs.sitemap.result }},juntar=${{ needs.juntar.result }},sitemap_arriendo=${{ needs.sitemap_arriendo.result }},juntar_arriendo=${{ needs.juntar_arriendo.result }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
