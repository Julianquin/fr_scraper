# ─────────────────────────────────────────────────────────────────────────────
# Barrido diario de FincaRaíz por HTTP y por segmentos: venta (E1) y arriendo (E3).
# Es LA fuente de datos desde el cambio de fuente (2-nov-2026): el scraper viejo
# (scraper.yml) quedó sin horario. Deja su crudo en R2 (raw/venta_http/fecha=…/) y
# el estado del mercado (estado/, estado_arriendo/).
#
#   Job 1 (plan):   arma el árbol de segmentos (src/segmentos.py) y lo reparte en 4 grupos
#   Job 2 (barrer): 4 jobs en paralelo, cada uno recorre entero su grupo de segmentos
#   Job 3 (juntar): une, deduplica, mide la cobertura real y sube el crudo + reporte a R2;
#                   luego consolida avisos + historial (src/consolidar.py: solo lo que cambió)
#   Jobs 4–6 (E3):  lo mismo para arriendos (--raiz arriendo: ~77 segmentos, ~4.900 páginas,
#                   ~30 min), DESPUÉS de venta para no leer el portal dos veces a la vez.
#                   Corren aunque venta falle. R2: raw/arriendo_http/ y estado_arriendo/
#   Job 7 (monitor): resumen del día por Telegram SOLO al administrador (src/monitor.py):
#                   cobertura, altas, bajas, cambios de precio y jobs fallidos. Corre
#                   siempre; si un día no llega, algo no corrió.
#
# Arranca con su propio horario (GitHub suele atrasarlo unas horas). Al terminar se
# encadenan: la alerta de los lunes (oportunidades.yml), el mapa (mapa.yml) y Metrocuadrado
# (metrocuadrado.yml). También se puede lanzar a mano.
# ─────────────────────────────────────────────────────────────────────────────
name: Barrido diario (venta y arriendo)

on:
  schedule:
    - cron: "0 6 * * *"          # todos los días 06:00 UTC (01:00 Colombia)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: barrido-http
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Árbol de segmentos repartido en 4 grupos
        run: python -m src.scraper_http plan --grupos 4
      - uses: actions/upload-artifact@v4
        with:
          name: http-plan
          path: |
            data/http/plan.csv
            data/http/nacional.json
          retention-days: 3

  barrer:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false            # si un grupo falla, los demás siguen
      max-parallel: 4
      matrix:
        grupo: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: http-plan
          path: data/http
      - name: Barrer el grupo ${{ matrix.grupo }}
        run: python -m src.scraper_http barrer --grupo ${{ matrix.grupo }}
      - uses: actions/upload-artifact@v4
        with:
          name: http-barrido-${{ matrix.grupo }}
          path: |
            data/http/barrido_${{ matrix.grupo }}.parquet
            data/http/informe_${{ matrix.grupo }}.csv
          retention-days: 3

  juntar:
    needs: barrer
    if: always()                  # junta lo que haya, aunque algún grupo falle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: http-*
          path: data/http
          merge-multiple: true
      - name: Juntar, medir cobertura y subir a R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m src.scraper_http juntar --subir
      - name: Consolidar avisos + historial (solo lo que cambió)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          FECHA=$(ls data/raw_http | sort | tail -1)      # la fecha que acaba de escribir "juntar"
          python -m src.consolidar --bajar --fecha "$FECHA" --subir

  # ── Arriendos (E3) ─────────────────────────────────────────────────────────
  plan_arriendo:
    needs: juntar
    if: ${{ !cancelled() }}       # independiente de que venta salga bien
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Árbol de segmentos de arriendo repartido en 4 grupos
        run: python -m src.scraper_http --raiz arriendo plan --grupos 4
      - uses: actions/upload-artifact@v4
        with:
          name: arriendo-plan
          path: |
            data/http_arriendo/plan.csv
            data/http_arriendo/nacional.json
          retention-days: 3

  barrer_arriendo:
    needs: plan_arriendo
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        grupo: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: arriendo-plan
          path: data/http_arriendo
      - name: Barrer el grupo ${{ matrix.grupo }} de arriendos
        run: python -m src.scraper_http --raiz arriendo barrer --grupo ${{ matrix.grupo }}
      - uses: actions/upload-artifact@v4
        with:
          name: arriendo-barrido-${{ matrix.grupo }}
          path: |
            data/http_arriendo/barrido_${{ matrix.grupo }}.parquet
            data/http_arriendo/informe_${{ matrix.grupo }}.csv
          retention-days: 3

  juntar_arriendo:
    needs: [plan_arriendo, barrer_arriendo]
    if: ${{ !cancelled() && needs.plan_arriendo.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: arriendo-*
          path: data/http_arriendo
          merge-multiple: true
      - name: Juntar, medir cobertura y subir a R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m src.scraper_http --raiz arriendo juntar --subir
      - name: Consolidar arriendos (solo lo que cambió)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          FECHA=$(ls data/raw_http_arriendo | sort | tail -1)
          python -m src.consolidar --raiz arriendo --bajar --fecha "$FECHA" --subir

  # ── Monitor de salud ───────────────────────────────────────────────────────
  monitor:
    needs: [plan, barrer, juntar, plan_arriendo, barrer_arriendo, juntar_arriendo]
    if: always()                  # justo cuando algo falla es cuando más importa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Resumen del día al administrador
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          python -m src.monitor resumen \
            --jobs "plan=${{ needs.plan.result }},barrer=${{ needs.barrer.result }},juntar=${{ needs.juntar.result }},plan_arriendo=${{ needs.plan_arriendo.result }},barrer_arriendo=${{ needs.barrer_arriendo.result }},juntar_arriendo=${{ needs.juntar_arriendo.result }}" \
            --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
