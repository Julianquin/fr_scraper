# ─────────────────────────────────────────────────────────────────────────────
# Alerta semanal de oportunidades (Cali).
#
#   Corre cuando termina el barrido diario (barrido_http.yml), pero solo sigue si en
#   Colombia es lunes: así usa siempre los datos recién actualizados. Lee el estado del
#   barrido (estado/ y estado_arriendo/ en R2, --fuente http): fecha real de publicación,
#   bajadas de precio de cada día y rentabilidad con los arriendos. Genera la alerta con
#   src/oportunidades.py y la envía con src/notificar.py a los canales que
#   tengan secrets configurados (Settings → Secrets and variables → Actions):
#     - Telegram: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#     - WhatsApp: CALLMEBOT_PHONE, CALLMEBOT_APIKEY
#   Si algo falla, avisa SOLO al administrador (TELEGRAM_ADMIN_CHAT_ID, src/monitor.py).
#
# ⚠️ El repo es público: el informe NO se sube como artifact (cualquiera con
#    cuenta de GitHub podría descargarlo). Solo viaja por el mensaje.
# ─────────────────────────────────────────────────────────────────────────────
name: Alerta semanal de oportunidades

on:
  workflow_run:
    workflows: ["Barrido diario (venta y arriendo)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      ciudad:
        description: "Ciudad"
        default: "Cali"

permissions:
  contents: read

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # El barrido termina en "failure" si falla un solo grupo, pero el estado se consolida igual
    # (y el monitor avisa): la alerta sale salvo que lo hayan cancelado
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: ¿Es lunes en Colombia?
        id: dia
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(TZ=America/Bogota date +%u)" = "1" ]; then
            echo "seguir=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hoy no es lunes en Colombia; no se envía alerta."
          fi
      - uses: actions/checkout@v4
        if: steps.dia.outputs.seguir == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}   # el código; los datos vienen de R2
      - uses: actions/setup-python@v5
        if: steps.dia.outputs.seguir == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        if: steps.dia.outputs.seguir == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Bajar el estado del barrido desde R2 (venta, su historial y arriendos)
        if: steps.dia.outputs.seguir == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m src.consolidar --bajar
          python -m src.consolidar --raiz arriendo --bajar
          python -m src.almacen traer estado/historial/ --destino data
      - name: Generar alerta
        if: steps.dia.outputs.seguir == 'true'
        run: python -m src.oportunidades --ciudad "${{ github.event.inputs.ciudad || 'Cali' }}" --fuente http
      - name: Enviar alerta
        if: steps.dia.outputs.seguir == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          shopt -s nullglob
          archivos=(reports/oportunidades/*_whatsapp.txt)
          if [ ${#archivos[@]} -eq 0 ]; then echo "No se generó alerta (sin datos en el periodo)."; exit 0; fi
          python -m src.notificar "${archivos[0]}"
      - name: Avisar al administrador si algo falló
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: >-
          python -m src.monitor fallo
          "La alerta semanal falló: puede que no haya salido o que algún destino no la recibiera"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
