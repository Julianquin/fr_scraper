# ─────────────────────────────────────────────────────────────────────────────
# Alerta semanal de oportunidades (Cali).
#
#   La lanza el disparador de Cloudflare (cloudflare/disparador/) los lunes a las 07:00 de
#   Colombia: el barrido arranca a medianoche, así que a esa hora ya está consolidado, y los
#   agentes la reciben en la mañana y no de madrugada. También se puede lanzar a mano (ojo:
#   a mano se envía a los agentes el día que sea). Lee el estado del
#   barrido (estado/ y estado_arriendo/ en R2, --fuente http): fecha real de publicación,
#   bajadas de precio de cada día y rentabilidad con los arriendos. Genera la alerta con
#   src/oportunidades.py y la envía con src/notificar.py a los canales que
#   tengan secrets configurados (Settings → Secrets and variables → Actions):
#     - Telegram: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#     - WhatsApp: CALLMEBOT_PHONE, CALLMEBOT_APIKEY
#   Si algo falla, avisa SOLO al administrador (TELEGRAM_ADMIN_CHAT_ID, src/monitor.py).
#
#   Después de la alerta, el informe semanal en PDF (src/informe_semanal.py: pulso del mercado, mapa y
#   tabla por comuna, oportunidades con comparables y entorno, bajadas y candidatas para captar). Si el
#   informe falla, la alerta ya salió y el administrador recibe un aviso.
#
#   Para probar sin molestar a los agentes: Run workflow con destino = admin (la alerta y el informe le
#   llegan solo al administrador; WhatsApp no se usa).
#
# ⚠️ El repo es público: el informe NO se sube como artifact (cualquiera con
#    cuenta de GitHub podría descargarlo). Solo viaja por el mensaje.
# ─────────────────────────────────────────────────────────────────────────────
name: Alerta semanal de oportunidades

on:
  workflow_dispatch:
    inputs:
      ciudad:
        description: "Ciudad"
        default: "Cali"
      destino:
        description: "agentes (lo normal) o admin (prueba: todo solo al administrador)"
        type: choice
        options: [agentes, admin]
        default: agentes

permissions:
  contents: read

jobs:
  alerta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # el código; los datos vienen de R2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Bajar el estado del barrido desde R2 (venta, su historial, arriendos, Metrocuadrado y OSM)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python -m src.consolidar --bajar
          python -m src.consolidar --raiz arriendo --bajar
          python -m src.almacen traer estado/historial/ --destino data
          python -m src.consolidar --raiz m2_venta --bajar      # informe: el mismo inmueble en los dos portales
          python -m src.almacen traer osm/ --destino data        # informe: el entorno de cada oportunidad
      - name: Generar alerta
        run: python -m src.oportunidades --ciudad "${{ github.event.inputs.ciudad || 'Cali' }}" --fuente http
      - name: Enviar alerta
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.destino == 'admin' && secrets.TELEGRAM_ADMIN_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ inputs.destino != 'admin' && secrets.CALLMEBOT_PHONE || '' }}
          CALLMEBOT_APIKEY: ${{ inputs.destino != 'admin' && secrets.CALLMEBOT_APIKEY || '' }}
        run: |
          shopt -s nullglob
          archivos=(reports/oportunidades/*_whatsapp.txt)
          if [ ${#archivos[@]} -eq 0 ]; then echo "No se generó alerta (sin datos en el periodo)."; exit 0; fi
          python -m src.notificar "${archivos[0]}"
      - name: Informe semanal en PDF
        id: informe
        continue-on-error: true            # la alerta ya salió: un fallo aquí no la estropea
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-inter libpango-1.0-0 libpangoft2-1.0-0 \
            || echo "⚠️  Sin la fuente Inter: el PDF sale con DejaVu Sans"
          pip install -r requirements-informe.txt
          python -m src.informe_semanal --ciudad "${{ github.event.inputs.ciudad || 'Cali' }}" \
            --enviar "${{ inputs.destino || 'agentes' }}"
      - name: Avisar al administrador si el informe falló
        if: steps.informe.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: >-
          python -m src.monitor fallo
          "El informe semanal en PDF falló (la alerta sí salió)"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Avisar al administrador si algo falló
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: >-
          python -m src.monitor fallo
          "La alerta semanal falló: puede que no haya salido o que algún destino no la recibiera"
          --url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
